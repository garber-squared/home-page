<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:LF;font-weight:100 900;src:url('../../public/fonts/libre-franklin-latin-wght-normal.woff2')}
@font-face{font-family:SS;font-weight:200 900;src:url('../../public/fonts/source-serif-4-latin-wght-normal.woff2')}

*{box-sizing:border-box;margin:0}
body{width:1200px;height:628px;overflow:hidden;background:#e4efe6;color:#10203a;font-family:SS,serif;position:relative}

.row:last-child{border-bottom:5px solid #10203a}
.n{font:800 38px/1 LF,sans-serif;text-align:right;padding-right:22px;letter-spacing:-.02em}
.w{font:800 118px/1 LF,sans-serif;letter-spacing:-.035em;padding-left:28px}

.foot i{font-style:italic}
.stamp{position:absolute;top:66px;right:64px;transform:rotate(-5deg);background:#e4efe6;color:#c8102e;border:6px solid #c8102e;outline:3px solid #c8102e;outline-offset:5px;font:800 46px/1 LF,sans-serif;letter-spacing:.09em;padding:12px 18px 12px 22px}
</style></head><body>

</div>
